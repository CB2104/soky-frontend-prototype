allowBuilds:
  sharp: true
  unrs-resolver: true

# Security floors for declared ranges that admit vulnerable versions. Caret
# ranges allow later compatible fixes; the lockfile pins the installed version.
overrides:
  'browserslist@>=4 <4.28.7': ^4.28.7
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'brace-expansion@>=1 <1.1.21': ^1.1.21
  'brace-expansion@>=5 <5.0.12': ^5.0.12
  'source-map-js@>=1 <1.2.2': ^1.2.2
  'zod@>=4 <4.6.6': ^4.6.6
